[project]
name = "vocalflow-api"
version = "0.1.0"
description = "VocalFlow control-plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "anthropic>=0.40.0",
    "boto3>=1.35.0",
    "cryptography>=43.0.0",
    "python-jose[cryptography]>=3.3.0",
    "twilio>=9.3.0",
    "livekit-api>=0.8.0",
    "langfuse>=2.52.0",
    "stripe>=11.1.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.17.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "phonenumbers>=8.13.0",
    "orjson>=3.10.0",
    "qdrant-client>=1.12.0",
    "cohere>=5.11.0",
    "pycountry>=24.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "freezegun>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# B008: Depends(...) in FastAPI defaults is the idiomatic pattern.
# N818: "ComplianceViolation" is a deliberate domain name; not renaming to ...Error.
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
# Strict mode is the long-term goal; flip on per-module once the codebase
# matures. ARCHITECTURE_DECISIONS.md AD-020.
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-ra"
