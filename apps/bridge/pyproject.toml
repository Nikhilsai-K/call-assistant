[project]
name = "vocalflow-bridge"
version = "0.1.0"
description = "Twilio Media Streams ↔ LiveKit room bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "livekit>=0.17.0",
    "livekit-api>=0.8.0",
    "numpy>=2.1.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM105", "RUF006"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["vocalflow_bridge/tests"]
