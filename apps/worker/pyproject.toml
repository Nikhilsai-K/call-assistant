[project]
name = "vocalflow-worker"
version = "0.1.0"
description = "VocalFlow post-call async pipeline"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "qdrant-client>=1.12.0",
    "cohere>=5.11.0",
    "langfuse>=2.52.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["vocalflow_worker/tests"]
